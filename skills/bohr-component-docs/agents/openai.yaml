interface:
  display_name: "玻尔组件搭建与文档"
  short_description: "从现有设计抽取玻尔组件，统一命名、状态、实例与 Token，并整理组件文档"
  default_prompt: "使用 $bohr-component-docs 处理指定 Figma 组件。先明确范围、唯一路径与目标 page；加载适用 Figma 技能，先原子后组合，复用批准库实例与变量。按指定模板整理 Components 矩阵，分开基础元素、组合/业务与任务进度；补齐状态、属性说明、真实实例和导航。必须核对 Light/Dark 成对案例及实际主题变量解析值。保护英文原组件与说明及共享依赖不被改动；中文图标必须逐项匹配玻尔资产和功能语义。验证默认值、长文本与嵌套背景，分别报告完成范围和未通过项。"
